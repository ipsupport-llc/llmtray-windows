name: CI

on:
  pull_request:
  push:
    branches: [main]
  # translate.yml runs it on its proposal branch (a PR opened by the
  # Actions token gets no checks by itself).
  workflow_dispatch:

permissions:
  contents: read

env:
  # The smoke-test model: small, ours, pinned by revision and SHA-256.
  SMOKE_REPO: roman220220/LFM2.5-1.2B-Instruct-GGUF-jang-imatrix
  SMOKE_REVISION: 536077886ff3305cbbfdf258e32ba1a224400093
  SMOKE_FILE: lfm2.5-1.2b-instruct-jang.gguf
  SMOKE_SHA256: e7d276710fc157d104ca0079694baacc4903cd3c7f2f8710139a90223ba6f63c

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test --project tests/LLMTray.Core.Tests
      - id: mac
        name: The Mac app's translations (pinned in l10n/mac.json)
        run: echo "commit=$(jq -r .commit l10n/mac.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ipsupport-llc/llmtray
          ref: ${{ steps.mac.outputs.commit }}
          sparse-checkout: Resources/Localization
          path: mac
          persist-credentials: false
      - name: Translations are valid
        run: |
          python3 -m unittest scripts/test_l10n.py
          python3 scripts/l10n.py check --mac mac/Resources/Localization
      - name: The Scoop bump script (on stand-in ZIPs)
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          'x64' | Set-Content (Join-Path $dist 'LLMTray-9.9.9-beta.1-x64-portable.zip')
          'arm' | Set-Content (Join-Path $dist 'LLMTray-9.9.9-beta.1-ARM64-portable.zip')
          $manifest = Join-Path $env:RUNNER_TEMP 'llmtray.json'
          Invoke-WebRequest https://raw.githubusercontent.com/ipsupport-llc/scoop-bucket/main/bucket/llmtray.json -OutFile $manifest
          $before = Get-Content $manifest -Raw | ConvertFrom-Json

          # A missing ZIP fails and leaves the manifest as it was.
          $copy = Get-Content $manifest -Raw
          try { scripts/bump-scoop.ps1 -Version 9.9.9-beta.2 -Dist $dist -Manifest $manifest; throw 'no failure' } catch { if ($_.Exception.Message -eq 'no failure') { throw } }
          if ((Get-Content $manifest -Raw) -ne $copy) { throw 'a failed bump changed the manifest' }

          scripts/bump-scoop.ps1 -Version 9.9.9-beta.1 -Dist $dist -Manifest $manifest
          $first = Get-Content $manifest -Raw
          $m = $first | ConvertFrom-Json
          if ($m.version -ne '9.9.9-beta.1') { throw 'version not set' }
          $want = (Get-FileHash (Join-Path $dist 'LLMTray-9.9.9-beta.1-x64-portable.zip') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($m.architecture.'64bit'.hash -ne $want) { throw 'x64 hash wrong' }
          if ($m.architecture.arm64.url -notlike '*/v9.9.9-beta.1/LLMTray-9.9.9-beta.1-ARM64-portable.zip') { throw 'ARM64 url wrong' }
          # Everything else is kept as it was.
          foreach ($field in 'description', 'homepage', 'license', 'extract_dir') { if ($m.$field -ne $before.$field) { throw "$field changed" } }
          if (($m.shortcuts | ConvertTo-Json -Compress) -ne ($before.shortcuts | ConvertTo-Json -Compress)) { throw 'shortcuts changed' }
          if ($m.checkver.regex -ne $before.checkver.regex) { throw 'checkver regex changed' }
          if ($m.autoupdate.architecture.'64bit'.url -notlike '*$version*') { throw 'autoupdate lost $version' }
          if ($first -notmatch '(?m)^    "version"') { throw 'not four-space indented' }

          # Again: same file. Older: left alone.
          scripts/bump-scoop.ps1 -Version 9.9.9-beta.1 -Dist $dist -Manifest $manifest
          if ((Get-Content $manifest -Raw) -ne $first) { throw 'a second run changed the file' }
          scripts/bump-scoop.ps1 -Version 0.0.1-beta.1 -Dist $dist -Manifest $manifest
          if ((Get-Content $manifest -Raw | ConvertFrom-Json).version -ne '9.9.9-beta.1') { throw 'an older release moved the manifest back' }
          Write-Host $first
      - name: Fetch from the real Hugging Face and Kaggle
        run: |
          dotnet run --project tools/LLMTray.Fetch -- hf "$SMOKE_REPO@$SMOKE_REVISION" LICENSE "$RUNNER_TEMP/hf/LICENSE"
          dotnet run --project tools/LLMTray.Fetch -- kaggle romanromenskyi/gemma-4-e2b-it-ipsupport/gguf/qat-phone/1 LICENSE "$RUNNER_TEMP/kaggle/LICENSE"
          dotnet run --project tools/LLMTray.Fetch -- kaggle romanromenskyi/gemma-4-e2b-it-ipsupport/gguf/qat-phone README.md "$RUNNER_TEMP/kaggle/README.md"

  # Builds the MSIX, installs it, and runs the smoke test against a real
  # llama-server and model (scripts/smoke.ps1). The package is signed with a
  # throwaway certificate made in the job: it installs only here.
  app:
    name: app (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x64, rid: win-x64, runner: windows-latest }
          - { platform: ARM64, rid: win-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test Core on Windows
        run: dotnet test --project tests/LLMTray.Core.Tests
      - name: Fetch llama.cpp
        shell: pwsh
        run: scripts/fetch-llama.ps1 -Rid ${{ matrix.rid }}
      - name: Build the command line
        shell: pwsh
        run: dotnet publish src/LLMTray.Cli -c Release -r ${{ matrix.rid }} -o src/LLMTray.App/cli
      - id: mac
        name: The Mac app's translations (pinned in l10n/mac.json)
        shell: pwsh
        run: '"commit=" + (Get-Content l10n/mac.json -Raw | ConvertFrom-Json).commit >> $env:GITHUB_OUTPUT'
      - name: Collect the translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ipsupport-llc/llmtray
          ref: ${{ steps.mac.outputs.commit }}
          sparse-checkout: Resources/Localization
          path: mac
          persist-credentials: false
      - name: Build the translations
        run: python scripts/l10n.py build --mac mac/Resources/Localization --out src/LLMTray.App/Strings
      - name: Collect the licenses
        shell: pwsh
        run: scripts/generate-licenses.ps1 -Rid ${{ matrix.rid }} -Platform ${{ matrix.platform }}
      - name: Make a throwaway signing certificate
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=IPSupport LLC' `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2) `
            -TextExtension @('2.5.29.19={text}')
          $cer = Join-Path $env:RUNNER_TEMP 'ci.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Build the MSIX
        run: >
          dotnet build src/LLMTray.App -c Release
          -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}
          -p:AppxPackageDir=${{ github.workspace }}\out\
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LLMTray-ci-${{ matrix.platform }}
          path: out/**/*.msix
          if-no-files-found: error
          retention-days: 7
      - name: Install
        shell: pwsh
        run: |
          $msix = Get-ChildItem out -Recurse -Filter *.msix | Select-Object -First 1
          Add-AppxPackage -Path $msix.FullName
          Get-AppxPackage IPSupportLLC.LLMTray | Format-List Name, Version, Architecture, PackageFamilyName
      - name: Cache the smoke-test model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.llmtray/models
          key: smoke-model-${{ env.SMOKE_SHA256 }}
      - name: Fetch the smoke-test model (the app's downloader)
        shell: pwsh
        run: |
          $file = Join-Path $HOME ".llmtray/models/$env:SMOKE_REPO/$env:SMOKE_FILE"
          dotnet run --project tools/LLMTray.Fetch -- hf "$env:SMOKE_REPO@$env:SMOKE_REVISION" $env:SMOKE_FILE $file $env:SMOKE_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'fetch failed' }
      - name: Smoke test
        shell: pwsh
        run: scripts/smoke.ps1 -Model ([IO.Path]::GetFileNameWithoutExtension($env:SMOKE_FILE)) -Out smoke -UiDownload:$${{ matrix.platform == 'x64' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-${{ matrix.platform }}
          path: smoke/
          retention-days: 7

  # The portable ZIP (adr/0004): built, unpacked, started, the API checked.
  portable:
    name: portable (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x64, rid: win-x64, runner: windows-latest }
          - { platform: ARM64, rid: win-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Fetch llama.cpp
        shell: pwsh
        run: scripts/fetch-llama.ps1 -Rid ${{ matrix.rid }}
      - name: Build the command line
        shell: pwsh
        run: dotnet publish src/LLMTray.Cli -c Release -r ${{ matrix.rid }} -o src/LLMTray.App/cli
      - id: mac
        name: The Mac app's translations (pinned in l10n/mac.json)
        shell: pwsh
        run: '"commit=" + (Get-Content l10n/mac.json -Raw | ConvertFrom-Json).commit >> $env:GITHUB_OUTPUT'
      - name: Collect the translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ipsupport-llc/llmtray
          ref: ${{ steps.mac.outputs.commit }}
          sparse-checkout: Resources/Localization
          path: mac
          persist-credentials: false
      - name: Build the translations
        run: python scripts/l10n.py build --mac mac/Resources/Localization --out src/LLMTray.App/Strings
      - name: Collect the licenses
        shell: pwsh
        run: scripts/generate-licenses.ps1 -Rid ${{ matrix.rid }} -Platform ${{ matrix.platform }}
      - name: Build the portable ZIP
        shell: pwsh
        run: scripts/build-portable.ps1 -Rid ${{ matrix.rid }} -Platform ${{ matrix.platform }} -Release 0.0.1-beta.1 -Zip out/LLMTray-ci-${{ matrix.platform }}-portable.zip -Setup out
      - name: Unpack and start it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Expand-Archive out/LLMTray-ci-${{ matrix.platform }}-portable.zip -DestinationPath $env:RUNNER_TEMP/portable
          Start-Process (Join-Path $env:RUNNER_TEMP 'portable/LLMTray/LLMTray.exe') -ArgumentList '--show-log', '--show-popover'
          $deadline = (Get-Date).AddSeconds(90)
          do {
            Start-Sleep -Seconds 2
            try { $models = Invoke-RestMethod http://127.0.0.1:8765/v1/models } catch { $models = $null }
          } until ($models -or (Get-Date) -gt $deadline)
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke/portable.png", [System.Drawing.Imaging.ImageFormat]::Png)
          if (-not $models) { throw 'the portable app did not serve the API' }
          Write-Host "portable API up; models: $($models.data.id -join ', ')"
          # The command line (adr/0013), through the app's pipe.
          $cli = Join-Path $env:RUNNER_TEMP 'portable/LLMTray/app/cli/llmtray.exe'
          $status = & $cli status --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $status.api) {
            Get-ChildItem $env:RUNNER_TEMP, $env:LOCALAPPDATA, $env:APPDATA -Recurse -Filter *.log -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in 'control.log', 'app-errors.log' } | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 50 }
            throw "llmtray status failed: $LASTEXITCODE"
          }
          $listed = & $cli models --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $listed.folder) { throw 'llmtray models failed' }
          & $cli frobnicate 2>$null
          if ($LASTEXITCODE -ne 2) { throw "a bad command exited $LASTEXITCODE, not 2" }
          Write-Host "llmtray: $($status.text); $($listed.models.Count) models"
          Stop-Process -Name LLMTray -Force
          # The bad command's exit code 2 is still in $LASTEXITCODE: the step itself passed.
          exit 0
      # The installer (adr/0007): installed silently for this user, started, the API checked, uninstalled.
      - name: Install and start it
        shell: pwsh
        run: |
          $setup = Get-ChildItem out -Filter *-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs/LLMTray'
          # Again over itself, as an update does: a file the build doesn't list goes.
          'stale' | Set-Content (Join-Path $dir 'app/stale.dll')
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the second setup exited with $($p.ExitCode)" }
          if (Test-Path (Join-Path $dir 'app/stale.dll')) { throw 'the update left a file of an older version' }
          foreach ($f in 'LLMTray.exe', 'README.txt', 'unins000.exe', 'app/LLMTray.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "the install has no $f" }
          }
          Get-ChildItem $dir | Format-Table Name, Length
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'LLMTray.lnk'))) { throw 'no Start menu shortcut' }
          Start-Process (Join-Path $dir 'LLMTray.exe')
          $deadline = (Get-Date).AddSeconds(90)
          do {
            Start-Sleep -Seconds 2
            try { $models = Invoke-RestMethod http://127.0.0.1:8765/v1/models } catch { $models = $null }
          } until ($models -or (Get-Date) -gt $deadline)
          if (-not $models) { throw 'the installed app did not serve the API' }
          Write-Host "installed API up"
          Stop-Process -Name LLMTray -Force
          Start-Sleep -Seconds 3
          $u = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstall exited with $($u.ExitCode)" }
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir 'app/LLMTray.exe')) { throw 'the uninstaller left the app' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: portable-${{ matrix.platform }}
          path: |
            smoke/
            out/*.zip
            out/*-setup.exe
          retention-days: 7
