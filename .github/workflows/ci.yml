name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The smoke-test model: small, ours, pinned by revision and SHA-256.
  SMOKE_REPO: roman220220/LFM2.5-1.2B-Instruct-GGUF-jang-imatrix
  SMOKE_REVISION: 536077886ff3305cbbfdf258e32ba1a224400093
  SMOKE_FILE: lfm2.5-1.2b-instruct-jang.gguf
  SMOKE_SHA256: e7d276710fc157d104ca0079694baacc4903cd3c7f2f8710139a90223ba6f63c

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test --project tests/LLMTray.Core.Tests
      - name: Fetch from the real Hugging Face and Kaggle
        run: |
          dotnet run --project tools/LLMTray.Fetch -- hf "$SMOKE_REPO@$SMOKE_REVISION" LICENSE "$RUNNER_TEMP/hf/LICENSE"
          dotnet run --project tools/LLMTray.Fetch -- kaggle romanromenskyi/gemma-4-e2b-it-ipsupport/gguf/qat-phone/1 LICENSE "$RUNNER_TEMP/kaggle/LICENSE"
          dotnet run --project tools/LLMTray.Fetch -- kaggle romanromenskyi/gemma-4-e2b-it-ipsupport/gguf/qat-phone README.md "$RUNNER_TEMP/kaggle/README.md"

  # Builds the MSIX, installs it, and runs the smoke test against a real
  # llama-server and model (scripts/smoke.ps1). The package is signed with a
  # throwaway certificate made in the job: it installs only here.
  app:
    name: app (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x64, rid: win-x64, runner: windows-latest }
          - { platform: ARM64, rid: win-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test Core on Windows
        run: dotnet test --project tests/LLMTray.Core.Tests
      - name: Fetch llama.cpp
        shell: pwsh
        run: scripts/fetch-llama.ps1 -Rid ${{ matrix.rid }}
      - name: Collect the licenses
        shell: pwsh
        run: scripts/generate-licenses.ps1 -Rid ${{ matrix.rid }} -Platform ${{ matrix.platform }}
      - name: Make a throwaway signing certificate
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=IPSupport LLC' `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2) `
            -TextExtension @('2.5.29.19={text}')
          $cer = Join-Path $env:RUNNER_TEMP 'ci.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Build the MSIX
        run: >
          dotnet build src/LLMTray.App -c Release
          -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}
          -p:AppxPackageDir=${{ github.workspace }}\out\
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LLMTray-ci-${{ matrix.platform }}
          path: out/**/*.msix
          if-no-files-found: error
          retention-days: 7
      - name: Install
        shell: pwsh
        run: |
          $msix = Get-ChildItem out -Recurse -Filter *.msix | Select-Object -First 1
          Add-AppxPackage -Path $msix.FullName
          Get-AppxPackage IPSupportLLC.LLMTray | Format-List Name, Version, Architecture, PackageFamilyName
      - name: Cache the smoke-test model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.llmtray/models
          key: smoke-model-${{ env.SMOKE_SHA256 }}
      - name: Fetch the smoke-test model (the app's downloader)
        shell: pwsh
        run: |
          $file = Join-Path $HOME ".llmtray/models/$env:SMOKE_REPO/$env:SMOKE_FILE"
          dotnet run --project tools/LLMTray.Fetch -- hf "$env:SMOKE_REPO@$env:SMOKE_REVISION" $env:SMOKE_FILE $file $env:SMOKE_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'fetch failed' }
      - name: Smoke test
        shell: pwsh
        run: scripts/smoke.ps1 -Model ([IO.Path]::GetFileNameWithoutExtension($env:SMOKE_FILE)) -Out smoke -UiDownload:$${{ matrix.platform == 'x64' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-${{ matrix.platform }}
          path: smoke/
          retention-days: 7

  # The portable ZIP (adr/0004): built, unpacked, started, the API checked.
  portable:
    name: portable (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x64, rid: win-x64, runner: windows-latest }
          - { platform: ARM64, rid: win-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Fetch llama.cpp
        shell: pwsh
        run: scripts/fetch-llama.ps1 -Rid ${{ matrix.rid }}
      - name: Collect the licenses
        shell: pwsh
        run: scripts/generate-licenses.ps1 -Rid ${{ matrix.rid }} -Platform ${{ matrix.platform }}
      - name: Build the portable ZIP
        shell: pwsh
        run: scripts/build-portable.ps1 -Rid ${{ matrix.rid }} -Platform ${{ matrix.platform }} -Release 0.0.1-beta.1 -Zip out/LLMTray-ci-${{ matrix.platform }}-portable.zip
      - name: Unpack and start it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Expand-Archive out/LLMTray-ci-${{ matrix.platform }}-portable.zip -DestinationPath $env:RUNNER_TEMP/portable
          Start-Process (Join-Path $env:RUNNER_TEMP 'portable/LLMTray/LLMTray.exe') -ArgumentList '--show-log', '--show-popover'
          $deadline = (Get-Date).AddSeconds(90)
          do {
            Start-Sleep -Seconds 2
            try { $models = Invoke-RestMethod http://127.0.0.1:8765/v1/models } catch { $models = $null }
          } until ($models -or (Get-Date) -gt $deadline)
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke/portable.png", [System.Drawing.Imaging.ImageFormat]::Png)
          if (-not $models) { throw 'the portable app did not serve the API' }
          Write-Host "portable API up; models: $($models.data.id -join ', ')"
          Stop-Process -Name LLMTray -Force
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: portable-${{ matrix.platform }}
          path: |
            smoke/
            out/*.zip
          retention-days: 7
