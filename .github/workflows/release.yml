name: Release

# Every v* tag (admin-only): build MSIX packages, portable ZIPs and installers
# for x64 and ARM64, sign them with Azure Artifact Signing, and publish them on
# GitHub Releases. Betas (vX.Y.Z-beta.N) are pre-releases. See adr/0002 and
# adr/0017. Signing runs in the `release` environment: its variables name the
# Azure tenant, app, account and profile (signed in with OIDC, no secret), and
# its secret MSIX_PUBLISHER is the certificate's subject (the manifest's
# Publisher), kept out of the repository.
on:
  push:
    tags: ['v*']
  # A dry run from main: everything built and signed, nothing published.
  workflow_dispatch:
    inputs:
      tag:
        description: The version to build as (vX.Y.Z or vX.Y.Z-beta.N); nothing is published
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.v.outputs.package_version }}
      display_version: ${{ steps.v.outputs.display_version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: dotnet run --project tools/LLMTray.Version -- "$TAG" | tee -a "$GITHUB_OUTPUT"

  # Built on each platform's own runner, unsigned: the signing action runs on
  # x64 Windows only, so the sign job below signs everything in one place.
  package:
    needs: version
    name: package (${{ matrix.platform }})
    # For MSIX_PUBLISHER only: no Azure sign-in here.
    environment: release
    strategy:
      matrix:
        include:
          - { platform: x64, rid: win-x64, runner: windows-latest }
          - { platform: ARM64, rid: win-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test Core
        run: dotnet test --project tests/LLMTray.Core.Tests
      - name: Fetch llama.cpp
        shell: pwsh
        run: scripts/fetch-llama.ps1 -Rid ${{ matrix.rid }}
      - name: Build the command line
        shell: pwsh
        run: dotnet publish src/LLMTray.Cli -c Release -r ${{ matrix.rid }} -o src/LLMTray.App/cli "-p:Version=${{ needs.version.outputs.display_version }}"
      - id: mac
        name: The Mac app's translations (pinned in l10n/mac.json)
        shell: pwsh
        run: '"commit=" + (Get-Content l10n/mac.json -Raw | ConvertFrom-Json).commit >> $env:GITHUB_OUTPUT'
      - name: Collect the translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ipsupport-llc/llmtray
          ref: ${{ steps.mac.outputs.commit }}
          sparse-checkout: Resources/Localization
          path: mac
          persist-credentials: false
      - name: Build the translations
        run: python scripts/l10n.py build --mac mac/Resources/Localization --out src/LLMTray.App/Strings
      - name: Collect the licenses
        shell: pwsh
        run: scripts/generate-licenses.ps1 -Rid ${{ matrix.rid }} -Platform ${{ matrix.platform }}
      - name: Stamp the package version and Publisher
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
          PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
        run: |
          if (-not $env:PUBLISHER) { throw 'the release environment has no MSIX_PUBLISHER secret' }
          $path = 'src/LLMTray.App/Package.appxmanifest'
          [xml]$m = Get-Content $path
          $m.Package.Identity.Version = $env:PACKAGE_VERSION
          $m.Package.Identity.Publisher = $env:PUBLISHER
          $m.Save((Resolve-Path $path))
      - name: Build the MSIX (unsigned)
        run: >
          dotnet build src/LLMTray.App -c Release
          -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false
          -p:AppxPackageDir=${{ github.workspace }}\out\
      - name: Collect
        shell: pwsh
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display_version }}
        run: |
          $msix = @(Get-ChildItem out -Recurse -Filter *.msix)
          if ($msix.Count -ne 1) { throw "expected one .msix, found $($msix.Count)" }
          New-Item -ItemType Directory -Force unsigned | Out-Null
          Copy-Item $msix[0].FullName "unsigned/LLMTray-$env:DISPLAY_VERSION-${{ matrix.platform }}.msix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-msix-${{ matrix.platform }}
          path: unsigned/*.msix
          if-no-files-found: error

  portable:
    needs: version
    name: portable (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - { platform: x64, rid: win-x64, runner: windows-latest }
          - { platform: ARM64, rid: win-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Fetch llama.cpp
        shell: pwsh
        run: scripts/fetch-llama.ps1 -Rid ${{ matrix.rid }}
      - name: Build the command line
        shell: pwsh
        run: dotnet publish src/LLMTray.Cli -c Release -r ${{ matrix.rid }} -o src/LLMTray.App/cli "-p:Version=${{ needs.version.outputs.display_version }}"
      - id: mac
        name: The Mac app's translations (pinned in l10n/mac.json)
        shell: pwsh
        run: '"commit=" + (Get-Content l10n/mac.json -Raw | ConvertFrom-Json).commit >> $env:GITHUB_OUTPUT'
      - name: Collect the translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ipsupport-llc/llmtray
          ref: ${{ steps.mac.outputs.commit }}
          sparse-checkout: Resources/Localization
          path: mac
          persist-credentials: false
      - name: Build the translations
        run: python scripts/l10n.py build --mac mac/Resources/Localization --out src/LLMTray.App/Strings
      - name: Collect the licenses
        shell: pwsh
        run: scripts/generate-licenses.ps1 -Rid ${{ matrix.rid }} -Platform ${{ matrix.platform }}
      - name: Lay out the portable app
        shell: pwsh
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display_version }}
        run: scripts/build-portable.ps1 -Step build -Rid ${{ matrix.rid }} -Platform ${{ matrix.platform }} -Release $env:DISPLAY_VERSION -Folder layout/LLMTray
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-${{ matrix.platform }}
          path: layout
          if-no-files-found: error

  # Everything signed on x64 (adr/0017): both MSIX packages; the portable
  # app's own programs, then its ZIP and installer made, the installers
  # signed last. Each signature is checked, and the MSIX signer must be the
  # package's Publisher. A dry run (workflow_dispatch) signs only from main.
  sign:
    needs: [version, package, portable]
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-msix-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: layout-x64
          path: layout-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: layout-ARM64
          path: layout-ARM64
      - id: files
        name: What to sign
        shell: pwsh
        run: |
          $msix = (Get-ChildItem dist -Filter *.msix | ForEach-Object FullName) -join ','
          $programs = foreach ($p in 'x64', 'ARM64') {
            foreach ($f in 'LLMTray.exe', 'app\LLMTray.exe', 'app\cli\llmtray.exe') { (Resolve-Path "layout-$p\LLMTray\$f").Path }
          }
          "msix=$msix" >> $env:GITHUB_OUTPUT
          "programs=$($programs -join ',')" >> $env:GITHUB_OUTPUT
      - name: Sign in to Azure (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the MSIX packages and the programs
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ steps.files.outputs.msix }},${{ steps.files.outputs.programs }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Build the portable ZIPs and the installers
        shell: pwsh
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display_version }}
        run: |
          foreach ($p in @(@{ Platform = 'x64'; Rid = 'win-x64' }, @{ Platform = 'ARM64'; Rid = 'win-arm64' })) {
            scripts/build-portable.ps1 -Step pack -Rid $p.Rid -Platform $p.Platform -Release $env:DISPLAY_VERSION -Folder "layout-$($p.Platform)/LLMTray" `
              -Zip "dist/LLMTray-$env:DISPLAY_VERSION-$($p.Platform)-portable.zip" -Setup dist
          }
      - id: setups
        name: The installers
        shell: pwsh
        run: '"files=" + ((Get-ChildItem dist -Filter *-setup.exe | ForEach-Object FullName) -join ",") >> $env:GITHUB_OUTPUT'
      - name: Sign the installers
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ steps.setups.outputs.files }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Check every signature
        shell: pwsh
        env:
          FILES: ${{ steps.files.outputs.msix }},${{ steps.files.outputs.programs }},${{ steps.setups.outputs.files }}
          PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
        run: |
          # Nothing about the signer is printed (adr/0017): the subject stays out of the logs.
          foreach ($f in $env:FILES.Split(',')) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "$(Split-Path $f -Leaf) is not validly signed ($($sig.Status))" }
            if ($sig.SignerCertificate.Subject -ne $env:PUBLISHER) { throw "$(Split-Path $f -Leaf): the signer isn't MSIX_PUBLISHER" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($f in (Get-ChildItem dist -Filter *.msix)) {
            if ((Get-AuthenticodeSignature $f.FullName).SignerCertificate.Subject -ne $env:PUBLISHER) { throw "$($f.Name): the signer isn't MSIX_PUBLISHER" }
            $zip = [IO.Compression.ZipFile]::OpenRead($f.FullName)
            try {
              $reader = [IO.StreamReader]::new($zip.GetEntry('AppxManifest.xml').Open())
              [xml]$m = $reader.ReadToEnd()
              $reader.Dispose()
            } finally { $zip.Dispose() }
            if ($m.Package.Identity.Publisher -ne $env:PUBLISHER) { throw "$($f.Name): the manifest's Publisher isn't the signer" }
          }
          Write-Host 'every file is signed, and each MSIX by its Publisher'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: |
            dist/*.msix
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    needs: [version, sign]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cat > notes.md <<'NOTES'
          Builds for Windows 11 (22H2 or later): `x64` for most PCs, `ARM64` for Snapdragon laptops.

          **Setup (`-setup.exe`).** Installs LLMTray for your user only, without administrator rights, with a Start menu shortcut and an uninstaller in **Settings › Apps**. If Windows SmartScreen stops it, choose **More info**, then **Run anyway**.

          **Package (`.msix`).** Open the `.msix` for your PC and choose **Install**: no certificate to install and no administrator rights. Since 0.1.2 the package is signed with the company's certificate, so Windows sees it as another app than an MSIX of 0.1.1 or earlier, and updating from inside 0.1.1 installs it beside the old one. Coming from such an MSIX: quit the old LLMTray (**Quit LLMTray** in its tray menu), start the new one from Start (it copies your settings and chats over), then remove the old one in **Settings › Apps**. Until then both are "LLMTray" in Start; the new one says in its chat when the old one can go.

          The packages, the installers and LLMTray's own programs are signed by IPSupport LLC with Azure Artifact Signing.

          **Portable (`-portable.zip`).** No installation and no administrator rights: unpack it anywhere you can write to and run `LLMTray\LLMTray.exe` (the `app` folder beside it holds the rest). If Windows SmartScreen stops it, choose **More info**, then **Run anyway**.

          All three update themselves: the app checks for new releases at start and on **Check for updates**.
          NOTES
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "LLMTray for Windows ${TAG#v}" --notes-file notes.md "${flags[@]}"

  # The Microsoft Store (adr/0025). The same unsigned packages, given the
  # identity Partner Center assigned (repository variables STORE_PACKAGE_NAME,
  # STORE_PUBLISHER, STORE_PUBLISHER_DISPLAY_NAME), bundled into one
  # .msixupload. Made for a stable tag and for a dry run; skipped until the
  # variables are set. The Store signs it.
  store-package:
    needs: [version, package]
    # Any of the four set means the Store is being set up: then all of them must be (the step below says which is missing).
    if: (vars.STORE_PACKAGE_NAME != '' || vars.STORE_PUBLISHER != '' || vars.STORE_PUBLISHER_DISPLAY_NAME != '' || vars.STORE_PRODUCT_ID != '') && (github.event_name == 'workflow_dispatch' || needs.version.outputs.prerelease != 'true')
    runs-on: windows-latest
    steps:
      - name: Every Store variable is set
        shell: pwsh
        env:
          STORE_PACKAGE_NAME: ${{ vars.STORE_PACKAGE_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $missing = 'STORE_PACKAGE_NAME', 'STORE_PUBLISHER', 'STORE_PUBLISHER_DISPLAY_NAME', 'STORE_PRODUCT_ID' | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) { throw "repository variables missing for the Store: $($missing -join ', ')" }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-msix-*
          path: unsigned
          merge-multiple: true
      - name: Make the Store package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
          STORE_PACKAGE_NAME: ${{ vars.STORE_PACKAGE_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: >
          scripts/store-package.ps1 -Msix unsigned -Version $env:PACKAGE_VERSION
          -Name $env:STORE_PACKAGE_NAME -Publisher $env:STORE_PUBLISHER
          -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME -Out store
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store
          path: store/*.msixupload
          if-no-files-found: error

  # Submitted to Partner Center for certification once the GitHub release is
  # out: stable tags only, through the `store` environment (its reviewers
  # approve each run; its secrets are the Partner Center app's). The app
  # needs one submission made by hand in Partner Center first (adr/0025).
  store-submit:
    needs: [version, store-package, publish]
    if: github.event_name == 'push' && needs.version.outputs.prerelease != 'true' && vars.STORE_PRODUCT_ID != ''
    runs-on: windows-latest
    environment: store
    concurrency:
      group: store-submission
      cancel-in-progress: false
    permissions:
      contents: read
      # Reading the environment's protection rules.
      actions: read
    steps:
      # The environment's approval is the human step before the Store (adr/0025): without a required reviewer, nothing goes.
      - name: The store environment asks the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $rules = gh api "repos/$env:GITHUB_REPOSITORY/environments/store" --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length'
          if ($LASTEXITCODE -ne 0) { throw "the store environment's settings couldn't be read" }
          if ([int]$rules -lt 1) { throw 'the store environment has no required reviewer: add the maintainer before anything is submitted' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store
          path: store
      - name: Set up the Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.4
      - name: Sign in to Partner Center
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          foreach ($n in 'TENANT_ID', 'SELLER_ID', 'CLIENT_ID', 'CLIENT_SECRET') {
            if (-not [Environment]::GetEnvironmentVariable($n)) { throw "the store environment has no PARTNER_CENTER_$n secret" }
          }
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Partner Center refused the credentials' }
      - name: Submit for certification
        shell: pwsh
        env:
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $upload = @(Get-ChildItem store -Filter *.msixupload)
          if ($upload.Count -ne 1) { throw "expected one .msixupload, found $($upload.Count)" }
          # A new submission from the last published one (listing, pricing kept), this package in it, committed.
          # msstore v0.4.4: the package file is the argument (.msix, .msixbundle or .msixupload).
          msstore publish $upload[0].FullName --appId $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw 'the submission failed' }
          # Where it stands now, for the log only: certification takes hours to days. A failure here mustn't
          # fail the job (a re-run would publish again and replace the submission just committed).
          msstore submission status $env:PRODUCT_ID
          exit 0

  # The Scoop bucket (ipsupport-llc/scoop-bucket, adr/0005) follows the
  # release by itself: the ZIPs' own SHA-256, pushed with that repo's deploy
  # key (write access to the bucket only). A job of its own, so a failed
  # bump can be re-run without publishing again; one at a time across tags.
  scoop:
    needs: [version, publish]
    runs-on: ubuntu-latest
    concurrency:
      group: scoop-bucket
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ipsupport-llc/scoop-bucket
          ssh-key: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          path: bucket
      - name: Point the Scoop bucket at this release
        shell: pwsh
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display_version }}
        run: |
          Set-Location bucket
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Someone else's change landing in between: start again from it.
          foreach ($attempt in 1..3) {
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            ../repo/scripts/bump-scoop.ps1 -Version $env:DISPLAY_VERSION -Dist ../dist -Manifest bucket/llmtray.json
            git add bucket/llmtray.json
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Host 'nothing to change'; exit 0 }
            git commit --quiet -m "llmtray $env:DISPLAY_VERSION"
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (5 * $attempt)
          }
          throw 'the bucket push failed three times'

