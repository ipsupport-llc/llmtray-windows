name: Release

# Every v* tag (admin-only): build MSIX packages, portable ZIPs and installers
# for x64 and ARM64, sign them with Azure Artifact Signing, and publish them on
# GitHub Releases. Betas (vX.Y.Z-beta.N) are pre-releases. See adr/0002 and
# adr/0017. Signing runs in the `release` environment: its variables name the
# Azure tenant, app, account and profile (signed in with OIDC, no secret), and
# its secret MSIX_PUBLISHER is the certificate's subject (the manifest's
# Publisher), kept out of the repository.
on:
  push:
    tags: ['v*']
  # A dry run from main: everything built and signed, nothing published.
  workflow_dispatch:
    inputs:
      tag:
        description: The version to build as (vX.Y.Z-beta.N); nothing is published
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.v.outputs.package_version }}
      display_version: ${{ steps.v.outputs.display_version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: dotnet run --project tools/LLMTray.Version -- "$TAG" | tee -a "$GITHUB_OUTPUT"
      - name: No stable release with the self-signed certificate (adr/0002)
        if: steps.v.outputs.prerelease != 'true'
        run: |
          echo "::error::Stable releases wait for a public signing certificate. Tag a beta (vX.Y.Z-beta.N)."
          exit 1

  package:
    needs: version
    name: package (${{ matrix.platform }})
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - { platform: x64, rid: win-x64, runner: windows-latest }
          - { platform: ARM64, rid: win-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test Core
        run: dotnet test --project tests/LLMTray.Core.Tests
      - name: Fetch llama.cpp
        shell: pwsh
        run: scripts/fetch-llama.ps1 -Rid ${{ matrix.rid }}
      - name: Build the command line
        shell: pwsh
        run: dotnet publish src/LLMTray.Cli -c Release -r ${{ matrix.rid }} -o src/LLMTray.App/cli "-p:Version=${{ needs.version.outputs.display_version }}"
      - id: mac
        name: The Mac app's translations (pinned in l10n/mac.json)
        shell: pwsh
        run: '"commit=" + (Get-Content l10n/mac.json -Raw | ConvertFrom-Json).commit >> $env:GITHUB_OUTPUT'
      - name: Collect the translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ipsupport-llc/llmtray
          ref: ${{ steps.mac.outputs.commit }}
          sparse-checkout: Resources/Localization
          path: mac
          persist-credentials: false
      - name: Build the translations
        run: python scripts/l10n.py build --mac mac/Resources/Localization --out src/LLMTray.App/Strings
      - name: Collect the licenses
        shell: pwsh
        run: scripts/generate-licenses.ps1 -Rid ${{ matrix.rid }} -Platform ${{ matrix.platform }}
      - name: Stamp the package version
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
        run: |
          $path = 'src/LLMTray.App/Package.appxmanifest'
          [xml]$m = Get-Content $path
          $m.Package.Identity.Version = $env:PACKAGE_VERSION
          $m.Save((Resolve-Path $path))
      - name: The certificate's subject as the package's Publisher
        shell: pwsh
        env:
          PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
        run: |
          if (-not $env:PUBLISHER) { throw 'the release environment has no MSIX_PUBLISHER secret' }
          $path = 'src/LLMTray.App/Package.appxmanifest'
          [xml]$m = Get-Content $path
          $m.Package.Identity.Publisher = $env:PUBLISHER
          $m.Save((Resolve-Path $path))
      - name: Build the MSIX
        run: >
          dotnet build src/LLMTray.App -c Release
          -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false
          -p:AppxPackageDir=${{ github.workspace }}\out\
      - id: msix
        name: Find the MSIX
        shell: pwsh
        run: |
          $msix = @(Get-ChildItem out -Recurse -Filter *.msix)
          if ($msix.Count -ne 1) { throw "expected one .msix, found $($msix.Count)" }
          "path=$($msix[0].FullName)" >> $env:GITHUB_OUTPUT
      - name: Sign in to Azure (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the MSIX
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ steps.msix.outputs.path }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Check the signature
        shell: pwsh
        env:
          MSIX: ${{ steps.msix.outputs.path }}
        run: |
          $sig = Get-AuthenticodeSignature $env:MSIX
          if ($sig.Status -ne 'Valid') { throw "the MSIX signature is $($sig.Status): $($sig.StatusMessage)" }
          Write-Host "signed by $($sig.SignerCertificate.Subject)"
      - name: Collect
        shell: pwsh
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display_version }}
          MSIX: ${{ steps.msix.outputs.path }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $env:MSIX "dist/LLMTray-$env:DISPLAY_VERSION-${{ matrix.platform }}.msix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  portable:
    needs: version
    name: portable (${{ matrix.platform }})
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - { platform: x64, rid: win-x64, runner: windows-latest }
          - { platform: ARM64, rid: win-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Fetch llama.cpp
        shell: pwsh
        run: scripts/fetch-llama.ps1 -Rid ${{ matrix.rid }}
      - name: Build the command line
        shell: pwsh
        run: dotnet publish src/LLMTray.Cli -c Release -r ${{ matrix.rid }} -o src/LLMTray.App/cli "-p:Version=${{ needs.version.outputs.display_version }}"
      - id: mac
        name: The Mac app's translations (pinned in l10n/mac.json)
        shell: pwsh
        run: '"commit=" + (Get-Content l10n/mac.json -Raw | ConvertFrom-Json).commit >> $env:GITHUB_OUTPUT'
      - name: Collect the translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ipsupport-llc/llmtray
          ref: ${{ steps.mac.outputs.commit }}
          sparse-checkout: Resources/Localization
          path: mac
          persist-credentials: false
      - name: Build the translations
        run: python scripts/l10n.py build --mac mac/Resources/Localization --out src/LLMTray.App/Strings
      - name: Collect the licenses
        shell: pwsh
        run: scripts/generate-licenses.ps1 -Rid ${{ matrix.rid }} -Platform ${{ matrix.platform }}
      - id: lay
        name: Lay out the portable app
        shell: pwsh
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display_version }}
        run: |
          scripts/build-portable.ps1 -Step build -Rid ${{ matrix.rid }} -Platform ${{ matrix.platform }} -Release $env:DISPLAY_VERSION -Zip "dist/LLMTray-$env:DISPLAY_VERSION-${{ matrix.platform }}-portable.zip"
          $folder = Join-Path ([IO.Path]::GetTempPath()) "llmtray-portable-${{ matrix.rid }}\LLMTray"
          "files=$folder\LLMTray.exe,$folder\app\LLMTray.exe,$folder\app\cli\llmtray.exe" >> $env:GITHUB_OUTPUT
      - name: Sign in to Azure (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the programs
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ steps.lay.outputs.files }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Build the portable ZIP and the installer
        shell: pwsh
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display_version }}
        run: scripts/build-portable.ps1 -Step pack -Rid ${{ matrix.rid }} -Platform ${{ matrix.platform }} -Release $env:DISPLAY_VERSION -Zip "dist/LLMTray-$env:DISPLAY_VERSION-${{ matrix.platform }}-portable.zip" -Setup dist
      - id: setup
        name: Find the installer
        shell: pwsh
        run: '"path=" + (Get-ChildItem dist -Filter *-setup.exe)[0].FullName >> $env:GITHUB_OUTPUT'
      - name: Sign the installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ steps.setup.outputs.path }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Check the signatures
        shell: pwsh
        env:
          FILES: ${{ steps.lay.outputs.files }},${{ steps.setup.outputs.path }}
        run: |
          foreach ($f in $env:FILES.Split(',')) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "$f is $($sig.Status): $($sig.StatusMessage)" }
            Write-Host "$f signed by $($sig.SignerCertificate.Subject)"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-portable-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    needs: [version, package, portable]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: msix-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cat > notes.md <<'NOTES'
          Builds for Windows 11 (22H2 or later): `x64` for most PCs, `ARM64` for Snapdragon laptops.

          **Setup (`-setup.exe`).** Installs LLMTray for your user only, without administrator rights, with a Start menu shortcut and an uninstaller in **Settings › Apps**. If Windows SmartScreen stops it, choose **More info**, then **Run anyway**.

          **Package (`.msix`).** Open the `.msix` for your PC and choose **Install**: no certificate to install and no administrator rights. Coming from an MSIX of 0.1.0-beta.11 or earlier (signed by "IPSupport LLC" with a self-signed certificate)? Windows sees this one as another app: quit the old LLMTray, install this one and start it (it copies your settings and chats over), then remove the old one in **Settings › Apps**.

          All files are signed with Azure Artifact Signing.

          **Portable (`-portable.zip`).** No installation and no administrator rights: unpack it anywhere you can write to and run `LLMTray\LLMTray.exe` (the `app` folder beside it holds the rest). If Windows SmartScreen stops it, choose **More info**, then **Run anyway**.

          All three update themselves: the app checks for new releases at start and on **Check for updates**.
          NOTES
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "LLMTray for Windows ${TAG#v}" --notes-file notes.md "${flags[@]}"

  # The Scoop bucket (ipsupport-llc/scoop-bucket, adr/0005) follows the
  # release by itself: the ZIPs' own SHA-256, pushed with that repo's deploy
  # key (write access to the bucket only). A job of its own, so a failed
  # bump can be re-run without publishing again; one at a time across tags.
  scoop:
    needs: [version, publish]
    runs-on: ubuntu-latest
    concurrency:
      group: scoop-bucket
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: msix-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ipsupport-llc/scoop-bucket
          ssh-key: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          path: bucket
      - name: Point the Scoop bucket at this release
        shell: pwsh
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display_version }}
        run: |
          Set-Location bucket
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Someone else's change landing in between: start again from it.
          foreach ($attempt in 1..3) {
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            ../repo/scripts/bump-scoop.ps1 -Version $env:DISPLAY_VERSION -Dist ../dist -Manifest bucket/llmtray.json
            git add bucket/llmtray.json
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Host 'nothing to change'; exit 0 }
            git commit --quiet -m "llmtray $env:DISPLAY_VERSION"
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (5 * $attempt)
          }
          throw 'the bucket push failed three times'

