name: Release

# Every v* tag (admin-only): build signed MSIX packages for x64 and ARM64 and
# publish them on GitHub Releases. Betas (vX.Y.Z-beta.N) are pre-releases.
# See adr/0002.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.v.outputs.package_version }}
      display_version: ${{ steps.v.outputs.display_version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: dotnet run --project tools/LLMTray.Version -- "$TAG" | tee -a "$GITHUB_OUTPUT"

  package:
    needs: version
    name: package (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - { platform: x64, rid: win-x64, runner: windows-latest }
          - { platform: ARM64, rid: win-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test Core
        run: dotnet test --project tests/LLMTray.Core.Tests
      - name: Stamp the package version
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
        run: |
          $path = 'src/LLMTray.App/Package.appxmanifest'
          [xml]$m = Get-Content $path
          $m.Package.Identity.Version = $env:PACKAGE_VERSION
          $m.Save((Resolve-Path $path))
      - name: Write the signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.MSIX_CERT_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { throw 'MSIX_CERT_PFX_BASE64 is not set' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
      - name: Build a signed MSIX
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: >
          dotnet build src/LLMTray.App -c Release
          -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateKeyFile="$env:RUNNER_TEMP\sign.pfx"
          -p:PackageCertificatePassword="$env:PFX_PASSWORD"
          -p:AppxPackageDir="${{ github.workspace }}\out\"
      - name: Collect
        shell: pwsh
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display_version }}
        run: |
          Remove-Item "$env:RUNNER_TEMP\sign.pfx"
          $msix = @(Get-ChildItem out -Recurse -Filter *.msix)
          if ($msix.Count -ne 1) { throw "expected one .msix, found $($msix.Count)" }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item $msix[0].FullName "dist/LLMTray-$env:DISPLAY_VERSION-${{ matrix.platform }}.msix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-${{ matrix.platform }}
          path: dist/*.msix
          if-no-files-found: error

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: msix-*
          path: dist
          merge-multiple: true
      - name: Export the public certificate
        env:
          PFX_BASE64: ${{ secrets.MSIX_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          echo "$PFX_BASE64" | base64 -d > "$RUNNER_TEMP/sign.pfx"
          openssl pkcs12 -in "$RUNNER_TEMP/sign.pfx" -passin env:PFX_PASSWORD -nokeys -clcerts \
            | openssl x509 -outform der -out dist/LLMTray-signing.cer
          rm "$RUNNER_TEMP/sign.pfx"
          ls -l dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cat > notes.md <<'NOTES'
          Builds for Windows 11 (22H2 or later): `x64` for most PCs, `ARM64` for Snapdragon laptops.

          These packages are signed with a self-signed certificate until the app gets a public one. Before the first install:

          1. Download `LLMTray-signing.cer`, open it, and choose **Install Certificate**.
          2. Pick **Local Machine**, then **Place all certificates in the following store**, **Trusted People**.
          3. Open the `.msix` for your PC and choose **Install**.
          NOTES
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "LLMTray for Windows ${TAG#v}" --notes-file notes.md "${flags[@]}"
